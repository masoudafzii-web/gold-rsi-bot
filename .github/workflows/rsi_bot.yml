name: RSI Gold Signal Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python rsi_signal_bot.py

      - name: Commit updated state (if changed)
        run: |
          if [ -f state.json ]; then
            git config user.name "rsi-bot"
            git config user.email "rsi-bot@users.noreply.github.com"
            git add state.json
            git diff --staged --quiet || git commit -m "update state"
            git push
          else
            echo "No state.json yet, nothing to commit."
          fi
